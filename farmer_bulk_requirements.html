
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Buyer Requirements | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    background:linear-gradient(
        135deg,
        #14001f,
        #2d014d,
        #4b0082,
        #6a0dad
    );

    color:white;

}


/* ================= NAVBAR ================= */

.navbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 8%;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.15);

}


.logo-section{

    display:flex;

    align-items:center;

    gap:15px;

}


.logo{

    width:60px;

    height:60px;

    padding:5px;

    background:white;

    border-radius:50%;

}


.logo-section h2{

    font-size:30px;

}


nav{

    display:flex;

    gap:20px;

    align-items:center;

}


nav a{

    color:white;

    text-decoration:none;

    font-weight:600;

    transition:.3s;

}


nav a:hover{

    color:#facc15;

}


.logout{

    padding:10px 18px;

    border-radius:25px;

    background:linear-gradient(
        90deg,
        #7e22ce,
        #9333ea,
        #c026d3
    );

}


/* ================= HEADER ================= */

.header{

    padding:60px 8% 30px;

    text-align:center;

}


.header h1{

    font-size:42px;

    margin-bottom:15px;

}


.header p{

    color:#ead5ff;

    font-size:17px;

    line-height:1.7;

    max-width:750px;

    margin:auto;

}


/* ================= REQUIREMENTS ================= */

.container{

    width:84%;

    max-width:1200px;

    margin:auto;

    padding-bottom:70px;

}


.requirements{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(310px,1fr));

    gap:25px;

}


/* ================= CARD ================= */

.requirement-card{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:22px;

    padding:28px;

    box-shadow:
        0 0 25px rgba(162,89,255,.3);

    transition:.3s;

}


.requirement-card:hover{

    transform:translateY(-7px);

    box-shadow:
        0 0 30px #d946ef;

}


.business{

    color:#facc15;

    font-size:21px;

    font-weight:600;

    margin-bottom:20px;

}


.detail{

    margin:12px 0;

    color:#ead5ff;

    line-height:1.6;

}


.detail strong{

    color:white;

}


.requirement-details{

    margin-top:18px;

    padding:15px;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    color:#ead5ff;

    line-height:1.7;

}


.status{

    display:inline-block;

    margin-top:18px;

    padding:6px 15px;

    border-radius:20px;

    background:rgba(34,197,94,.18);

    color:#86efac;

    font-size:13px;

    font-weight:bold;

}


/* ================= BUTTON ================= */

.interest-btn{

    width:100%;

    margin-top:20px;

    padding:13px;

    border:none;

    border-radius:30px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(
        90deg,
        #7e22ce,
        #9333ea,
        #c026d3
    );

    transition:.3s;

}


.interest-btn:hover{

    transform:translateY(-3px);

    box-shadow:
        0 0 20px #d946ef;

}


.interest-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;

}


/* ================= EMPTY ================= */

.empty{

    text-align:center;

    padding:50px 20px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    border-radius:20px;

    color:#ead5ff;

}


.empty h2{

    color:white;

    margin-bottom:10px;

}


/* ================= FOOTER ================= */

.footer{

    padding:30px;

    text-align:center;

    background:rgba(255,255,255,.08);

    border-top:1px solid rgba(255,255,255,.15);

}


.footer p{

    color:#ead5ff;

    margin:8px;

}


.footer a{

    color:white;

    text-decoration:none;

    margin:0 10px;

}


.footer a:hover{

    color:#facc15;

}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .navbar{

        flex-direction:column;

        gap:20px;

    }

    nav{

        flex-wrap:wrap;

        justify-content:center;

    }

    .header h1{

        font-size:34px;

    }

    .container{

        width:92%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">


    <div class="logo-section">

        <img
            src="logo.jpg"
            class="logo"
            alt="FarmXT Logo">

        <h2>
            FarmXT
        </h2>

    </div>


    <nav>

        <a href="farmer_dashboard.html">
            Dashboard
        </a>

        <a href="produce_type.html">
            Upload Crop
        </a>

        <a href="featured_listings.html">
            My Crops
        </a>

        <a href="farmer_orders.html">
            Orders
        </a>

        <a
            href="#"
            class="logout"
            onclick="logout(event)">

            Logout

        </a>

    </nav>

</header>



<!-- =====================================================
     HEADER
===================================================== -->

<section class="header">

    <h1>
        🤝 Bulk Buyer Requirements
    </h1>


    <p>

        View crop requirements posted by
        Bulk Buyers and connect with them
        if you can supply the required crop.

    </p>

</section>



<!-- =====================================================
     REQUIREMENTS
===================================================== -->

<div class="container">

    <div
        class="requirements"
        id="requirementsContainer">

    </div>

</div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <p>
        © 2026 FarmXT |
        Empowering Farmers Through Technology
    </p>

    <p>

        <a href="contact.html">
            Contact
        </a>

        |

        <a href="community_network.html">
            Community
        </a>

        |

        <a href="transparency.html">
            Transparency
        </a>

    </p>

</footer>



<script>


// =====================================================
// CHECK FARMER LOGIN
// =====================================================

let farmer = JSON.parse(
    localStorage.getItem("currentFarmer")
);


if(!farmer){

    alert(
        "Please login as a Farmer first."
    );

    window.location.href =
        "farmer_login.html";

}



// =====================================================
// LOAD BULK BUYER REQUIREMENTS
// =====================================================

function loadRequirements(){

    let requirements =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerRequirements"
            )
        ) || [];


    let container =
        document.getElementById(
            "requirementsContainer"
        );



    // Only open requirements

    let openRequirements =
        requirements.filter(
            function(requirement){

                return (
                    !requirement.status ||
                    requirement.status === "Open"
                );

            }
        );



    // =================================================
    // NO REQUIREMENTS
    // =================================================

    if(openRequirements.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h2>
                    🌾 No Requirements Available
                </h2>

                <p>

                    There are currently no open
                    Bulk Buyer requirements.

                </p>

            </div>

        `;

        return;

    }



    container.innerHTML = "";



    // =================================================
    // DISPLAY REQUIREMENTS
    // =================================================

    openRequirements.forEach(
        function(requirement){

            container.innerHTML += `

                <div
                    class="requirement-card"
                    id="requirement-${requirement.id}">


                    <div class="business">

                        🏪 ${
                            requirement.businessName ||
                            "Bulk Buyer"
                        }

                    </div>


                    <div class="detail">

                        <strong>
                            🌾 Crop Needed:
                        </strong>

                        ${
                            requirement.cropNeeded ||
                            "Not Available"
                        }

                    </div>


                    <div class="detail">

                        <strong>
                            📦 Quantity Required:
                        </strong>

                        ${
                            requirement.quantity ||
                            "Not Available"
                        }

                    </div>


                    <div class="detail">

                        <strong>
                            📍 Delivery Location:
                        </strong>

                        ${
                            requirement.deliveryLocation ||
                            "Not Available"
                        }

                    </div>


                    <div class="detail">

                        <strong>
                            📅 Required Date:
                        </strong>

                        ${
                            requirement.deliveryDate ||
                            "Not Available"
                        }

                    </div>


                    <div class="requirement-details">

                        <strong>
                            📝 Requirement Details:
                        </strong>

                        <br>

                        ${
                            requirement.requirement ||
                            "No details provided"
                        }

                    </div>


                    <span class="status">

                        🟢 Open Requirement

                    </span>


                    <button
                        class="interest-btn"
                        onclick="showInterest(${requirement.id})">

                        🤝 I'm Interested

                    </button>


                </div>

            `;

        }
    );

}



// =====================================================
// FARMER SHOWS INTEREST
// =====================================================

function showInterest(requirementId){


    if(!farmer){

        alert(
            "Please login as a Farmer first."
        );

        return;

    }



    // =================================================
    // GET REQUIREMENTS
    // =================================================

    let requirements =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerRequirements"
            )
        ) || [];


    let requirement =
        requirements.find(
            function(item){

                return item.id == requirementId;

            }
        );


    if(!requirement){

        alert(
            "Requirement not found."
        );

        return;

    }



    // =================================================
    // GET EXISTING INTERESTS
    // =================================================

    let interests =
        JSON.parse(
            localStorage.getItem(
                "bulkBuyerInterests"
            )
        ) || [];



    // =================================================
    // CHECK DUPLICATE INTEREST
    // =================================================

    let alreadyInterested =
        interests.some(
            function(interest){

                return (

                    interest.requirementId ==
                    requirementId

                    &&

                    interest.farmerId ==
                    farmer.id

                );

            }
        );


    if(alreadyInterested){

        alert(
            "You have already shown interest in this requirement."
        );

        return;

    }



    // =================================================
    // CREATE INTEREST
    // =================================================

    let newInterest = {

        id:
            Date.now(),

        requirementId:
            requirement.id,

        buyerId:
            requirement.buyerId,

        buyerBusinessName:
            requirement.businessName,

        farmerId:
            farmer.id,

        farmerName:
            farmer.name ||
            farmer.farmerName ||
            "Farmer",

        availableCrop:
            requirement.cropNeeded,

        availableQuantity:
            requirement.quantity,

        deliveryDate:
            requirement.deliveryDate,

        message:
            "I am interested in supplying this requirement.",

        status:
            "Pending",

        createdAt:
            new Date().toLocaleString()

    };



    // =================================================
    // SAVE INTEREST
    // =================================================

    interests.push(
        newInterest
    );


    localStorage.setItem(
        "bulkBuyerInterests",
        JSON.stringify(interests)
    );



    // =================================================
    // UPDATE BUTTON
    // =================================================

    let card =
        document.getElementById(
            "requirement-" +
            requirementId
        );


    if(card){

        let button =
            card.querySelector(
                ".interest-btn"
            );


        if(button){

            button.innerText =
                "✓ Interest Sent";

            button.disabled =
                true;

        }

    }



    alert(
        "Your interest has been sent to the Bulk Buyer!"
    );

}



// =====================================================
// LOGOUT
// =====================================================

function logout(event){

    event.preventDefault();


    localStorage.removeItem(
        "currentFarmer"
    );


    localStorage.removeItem(
        "userType"
    );


    alert(
        "Logged Out Successfully!"
    );


    window.location.href =
        "final.html";

}



// =====================================================
// LOAD PAGE
// =====================================================

if(farmer){

    loadRequirements();

}

</script>


</body>

</html>
