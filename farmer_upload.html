<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Upload Product | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;

}

.container{

width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
padding:35px;
border-radius:20px;
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 30px rgba(162,89,255,.4);

}

h1{

text-align:center;
color:white;
margin-bottom:30px;

}

input,
textarea,
select{

width:100%;
padding:14px;
margin:12px 0;
border:none;
outline:none;
border-radius:10px;
font-size:16px;
background:rgba(255,255,255,.12);
color:white;

}

input::placeholder,
textarea::placeholder{

color:#ddd;

}

option{

color:black;

}

textarea{

height:100px;
resize:none;

}

label{

color:white;
font-weight:bold;

}

button{

width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:30px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
transition:.3s;

}

button:hover{

box-shadow:0 0 20px #d946ef;

}

.back{

display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
font-weight:bold;

}

.back:hover{

color:#facc15;

}

</style>

</head>

<body>

<div class="container">

<h1>🌾 Upload Product</h1>

<form id="productForm">

<input
type="text"
id="name"
placeholder="Product Name"
required>

<input
type="text"
id="farmer"
placeholder="Farmer Name"
required>

<input
type="text"
id="location"
placeholder="Location"
required>

<select id="category" required>

<option value="">Select Category</option>

<option>Vegetables</option>

<option>Fruits</option>

<option>Grains</option>

<option>Dairy</option>

<option>Organic</option>

</select>

<input
type="number"
id="price"
placeholder="Price per Kg"
required>

<textarea
id="description"
placeholder="Product Description"
required></textarea>

<label>Upload Product Image</label>

<input
type="file"
id="image"
accept="image/*"
required>

<button type="submit">

Upload Product

</button>

</form>

<a href="market_place.html" class="back">

⬅ Go to Marketplace

</a>

</div>

<script>

document.getElementById("productForm").addEventListener("submit",function(e){

e.preventDefault();

let file=document.getElementById("image").files[0];

if(!file){

alert("Please select an image.");

return;

}

let reader=new FileReader();

reader.onload=function(){

let products=
JSON.parse(localStorage.getItem("products")) || [];

products.push({

name:document.getElementById("name").value,

farmer:document.getElementById("farmer").value,

location:document.getElementById("location").value,

category:document.getElementById("category").value,

price:document.getElementById("price").value,

description:document.getElementById("description").value,

image:reader.result

});

localStorage.setItem(

"products",

JSON.stringify(products)

);

alert("Product Uploaded Successfully!");

document.getElementById("productForm").reset();

};

reader.readAsDataURL(file);

});

</script>

</body>
</html>
