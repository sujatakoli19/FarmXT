<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Added | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}

.success-card{

width:650px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:50px;
text-align:center;
box-shadow:0 0 30px rgba(162,89,255,.4);

}

.logo{

width:90px;
height:90px;
border-radius:50%;
background:white;
padding:6px;
margin-bottom:20px;

}

.tick{

width:110px;
height:110px;
margin:20px auto;
border-radius:50%;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
display:flex;
justify-content:center;
align-items:center;
font-size:55px;
color:white;
box-shadow:0 0 25px #d946ef;

}

h1{

color:white;
margin-top:20px;
margin-bottom:15px;

}

p{

color:#ead5ff;
font-size:18px;
margin-bottom:35px;

}

.buttons{

display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;

}

.btn{

text-decoration:none;
padding:14px 24px;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-weight:bold;
transition:.3s;

}

.btn:hover{

transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;

}

</style>

</head>

<body>

<div class="success-card">

<img src="logo.jpg" class="logo" alt="FarmXT Logo">

<div class="tick">✔</div>

<h1>Product Added Successfully!</h1>

<p>Your product has been listed on the FarmXT Marketplace.</p>

<div class="buttons">

<a href="produce-type.html" class="btn">Add Another Product</a>

<a href="market_place.html" class="btn">View Marketplace</a>

<a href="farmer_dashboard.html" class="btn">Farmer Dashboard</a>

</div>

</div>

</body>

</html>
