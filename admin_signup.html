<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Sign Up | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.signup-box{
width:450px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:35px;
box-shadow:0 0 35px rgba(162,89,255,.5);
}

.logo{
display:block;
margin:auto;
width:110px;
height:110px;
padding:8px;
border-radius:50%;
background:white;
box-shadow:0 0 20px #a855f7;
}

h2{
text-align:center;
color:white;
margin:20px 0 10px;
}

.subtitle{
text-align:center;
color:#ead5ff;
margin-bottom:30px;
}

label{
display:block;
color:#ead5ff;
font-weight:600;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
margin-bottom:18px;
border-radius:12px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.08);
color:white;
outline:none;
font-size:15px;
}

input::placeholder{
color:#d8c8f0;
}

input:focus{
border:1px solid #d946ef;
box-shadow:0 0 15px #c026d3;
}

.show{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
color:#ead5ff;
}

.show input{
width:auto;
margin:0;
}

.show label{
margin:0;
cursor:pointer;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;
}

.links{
text-align:center;
margin-top:20px;
line-height:35px;
}

.links a{
color:white;
text-decoration:none;
font-weight:600;
}

.links a:hover{
color:#facc15;
}

</style>

</head>

<body>

<div class="signup-box">

<img src="logo.jpg" class="logo" alt="FarmXT Logo">

<h2>👨‍💼 Admin Sign Up</h2>

<p class="subtitle">
Create your Admin Account
</p>

<form id="adminSignupForm">

<label>Admin Name</label>

<input
type="text"
id="adminName"
placeholder="Enter Admin Name"
required>

<label>Admin ID</label>

<input
type="text"
id="adminId"
placeholder="Create Admin ID"
required>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required>

<label>Create Password</label>

<input
type="password"
id="password"
placeholder="Create Password"
required>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<div class="show">

<input type="checkbox" id="showPassword">

<label for="showPassword">
Show Password
</label>

</div>

<button type="submit">
Create Account
</button>

</form>

<div class="links">

<p>
Already have an account?
<a href="admin_login.html">Login</a>
</p>

<p>
<a href="final.html">🏠 Back to Home</a>
</p>

</div>

</div>

<script>

// Show / Hide Password

document.getElementById("showPassword").addEventListener("change", function(){

let type = this.checked ? "text" : "password";

document.getElementById("password").type = type;
document.getElementById("confirmPassword").type = type;

});

// Sign Up
document.getElementById("adminSignupForm").addEventListener("submit", function(e){

    e.preventDefault();

    let adminName = document.getElementById("adminName").value.trim();
    let adminId = document.getElementById("adminId").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();

    if(password !== confirmPassword){
        alert("Passwords do not match!");
        return;
    }

    // Get all existing admins
    let admins = JSON.parse(localStorage.getItem("admins")) || [];

    // Check duplicate Admin ID
    let idExists = admins.some(admin => admin.id === adminId);

    if(idExists){
        alert("Admin ID already exists!");
        return;
    }

    // Check duplicate Email
    let emailExists = admins.some(admin => admin.email === email);

    if(emailExists){
        alert("Email already registered!");
        return;
    }

    // Create new admin
    let admin = {
        name: adminName,
        id: adminId,
        email: email,
        password: password
    };

    // Add to array
    admins.push(admin);

    // Save back
    localStorage.setItem("admins", JSON.stringify(admins));

    alert("Admin Account Created Successfully!");

    window.location.href = "admin_login.html";

});



</script>

</body>
</html>
