<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}
/* ===== NAVBAR ===== */

.navbar{

display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.15);
position:sticky;
top:0;
z-index:1000;

}

.logo-section{

display:flex;
align-items:center;
gap:15px;

}

.logo{

width:60px;
height:60px;
border-radius:50%;
background:white;
padding:5px;
box-shadow:0 0 15px #a855f7;

}

.logo-section h2{

color:white;
font-size:30px;

}

nav{

display:flex;
align-items:center;
gap:25px;

}

nav a{

color:white;
text-decoration:none;
font-size:16px;
font-weight:600;
transition:.3s;

}

nav a:hover{

color:#facc15;

}

.logout{

background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
padding:10px 18px;
border-radius:25px;

}

.logout:hover{

box-shadow:0 0 20px #d946ef;

}
/* ===== PAYMENT ===== */

.payment-section{

display:flex;
justify-content:center;
align-items:center;
padding:60px 20px;

}

.payment-card{

width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:40px;
box-shadow:0 0 30px rgba(162,89,255,.4);

}

.payment-card h1{

text-align:center;
margin-bottom:30px;
font-size:36px;
color:white;

}

.payment-card label{

display:block;
margin-bottom:8px;
color:#ead5ff;
font-weight:600;

}

.payment-card select,
.payment-card input{

width:100%;
padding:14px;
margin-bottom:20px;
border-radius:12px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.12);
color:white;
font-size:16px;
outline:none;

}

.payment-card select option{

background:#2d014d;
color:white;

}

.payment-card select:focus,
.payment-card input:focus{

border:1px solid #d946ef;
box-shadow:0 0 15px #c026d3;

}

.payment-card input::placeholder{

color:#ead5ff;

}

.payment-card button{

width:100%;
padding:15px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

.payment-card button:hover{

transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;

}
</style>

</head>

<body>
    <header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo">

<h2>FarmXT</h2>

</div>

<nav>

<a href="client_dashboard.html">Dashboard</a>

<a href="market_place.html">Marketplace</a>

<a href="my_orders.html">My Orders</a>

<a href="client_profile.html">Profile</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>
<section class="payment-section">

<div class="payment-card">

<h1>Payment</h1>

<form>

<label>Payment Method</label>

<select required>

<option value="">Select Payment Method</option>

<option>UPI</option>

<option>Debit Card</option>

<option>Credit Card</option>

<option>Net Banking</option>

<option>Cash on Delivery</option>

</select>

<label>Amount (₹)</label>

<input
type="number"
placeholder="Enter amount"
required>

<button type="submit">
Proceed to Pay
</button>

</form>

</div>

</section>
<script>

document.querySelector("form").addEventListener("submit",function(e){

e.preventDefault();

alert("Payment Successful!");

window.location.href="post_success.html";

});

</script>
</body>

</html>
