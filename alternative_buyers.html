<!DOCTYPE html>
<html>
<head>
    <title>Alternative Buyers Ecosystem</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    padding:40px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    max-width:900px;
    margin:auto;
}

.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}

h1{
    text-align:center;
    color:#ffffff;
    margin-bottom:35px;
    font-size:38px;
}

h2{
    color:#f3e8ff;
    margin-bottom:18px;
}

form{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:30px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 35px rgba(162,89,255,0.5);
    max-width:500px;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    color:#ead5ff;
}

input,
select{
    width:100%;
    padding:13px;
    margin-top:8px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    outline:none;
    font-size:15px;
}

input::placeholder{
    color:#d8c8f0;
}

input:focus,
select:focus{
    border:1px solid #d946ef;
    box-shadow:0 0 15px #c026d3;
}

select{
    max-width:300px;
}

select option{
    background:#2d014d;
    color:white;
}

button{
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    padding:14px 25px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;
}

hr{
    margin:35px 0;
    border:none;
    border-top:2px solid rgba(255,255,255,0.2);
}

ul{
    list-style:none;
    max-width:500px;
}

ul li{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    color:#f3e8ff;
    padding:18px;
    margin-bottom:15px;
    border-left:5px solid #c084fc;
    border-radius:15px;
    box-shadow:0 0 20px rgba(162,89,255,0.3);
    font-size:16px;
}

</style>

</head>

<body>

<div class="container">

    <img src="logo.jpg" alt="FarmXT Logo" class="logo">

    <h1>🌾 FarmXT Buyer Network</h1>

    <h2>Farmer Product Details</h2>

    <form>

        <label>Farmer Name:</label>
        <input type="text" placeholder="Enter farmer name">

        <label>Product Name:</label>
        <input type="text" placeholder="Enter product name">

        <label>Quantity (Kg):</label>
        <input type="number" placeholder="Enter quantity">

        <label>Price (₹ per Kg):</label>
        <input type="number" placeholder="Enter price">

        <button type="submit">📦 Submit Product</button>

    </form>

    <hr>

    <h2>Available Buyers</h2>

    <ul>
        <li>Fresh Food MSME</li>
        <li>Green Valley Restaurant</li>
        <li>City Retail Shop</li>
        <li>Bulk Vegetable Supplier</li>
    </ul>

</div>

</body>
</html>
