<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Successful | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}

.container{

width:650px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 0 35px rgba(162,89,255,.5);

}

.logo{

width:90px;
background:white;
padding:8px;
border-radius:50%;
margin-bottom:20px;

}

.check{

font-size:90px;
margin:20px 0;

}

h1{

color:#ffffff;
margin-bottom:20px;

}

p{

color:#ead5ff;
font-size:18px;
line-height:30px;
margin-bottom:15px;

}

.btn{

display:inline-block;
margin-top:25px;
padding:15px 35px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:.3s;

}

.btn:hover{

box-shadow:0 0 20px #d946ef;
transform:translateY(-3px);

}

<body>

<div class="container">
