<!DOCTYPE html>
<html lang="en">
<head>
<title>Featured Listings & Promotions</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    width:100%;
    max-width:600px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 35px rgba(162,89,255,0.5);
}

.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}

h1{
    text-align:center;
    color:#ffffff;
    margin-bottom:30px;
    font-size:32px;
}

h2{
    color:#f3e8ff;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#ead5ff;
}

input,
select{
    width:100%;
    padding:13px;
    border-radius:12px;
    margin-bottom:18px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
    outline:none;
}

input::placeholder{
    color:#d8c8f0;
}

select option{
    background:#2d014d;
    color:white;
}

input:focus,
select:focus{
    border:1px solid #d946ef;
    box-shadow:0 0 15px #c026d3;
}

button{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;
}

hr{
    margin:30px 0;
    border:none;
    border-top:2px solid rgba(255,255,255,0.2);
}

#result{
    background:rgba(255,255,255,0.12);
    padding:20px;
    border-left:5px solid #c084fc;
    border-radius:15px;
    min-height:90px;
    line-height:1.8;
    color:#f3e8ff;
    font-size:16px;
}

#result strong{
    color:#facc15;
}

.featured{
    color:#fbbf24;
    font-weight:bold;
    font-size:20px;
}

</style>

</head>

<body>

<div class="container">

    <img src="logo.jpg" alt="FarmXT Logo" class="logo">

    <h1>🌾 My Crops</h1>


    <hr>

  <h2>Your Uploaded Crops</h2>
  

    <div id="result">
        No product listing available.
    </div>


</div>


<script>
let currentFarmer = JSON.parse(localStorage.getItem("currentFarmer"));

if (!currentFarmer) {
    alert("Please login first.");
    window.location.href = "farmer_login.html";
}

// Load crops when page opens
window.onload = function () {

    displayMyCrops();

};

function displayMyCrops(){

    let currentFarmer =
    JSON.parse(localStorage.getItem("currentFarmer"));

let crops =
    JSON.parse(localStorage.getItem("crops")) || [];

console.log("Current Farmer:", currentFarmer);
console.log("All Crops:", crops);

let myCrops = crops.filter(crop =>
    String(crop.farmerMobile).trim() ===
    String(currentFarmer.mobile).trim()
);

console.log("My Crops:", myCrops);

    let result = document.getElementById("result");

    if(myCrops.length === 0){

        result.innerHTML = "<h3>No crops uploaded yet.</h3>";

        return;

    }

    let output = "";

    myCrops.forEach(function(crop,index){

        output += `
        <div style="background:rgba(255,255,255,.08);
                    padding:20px;
                    border-radius:15px;
                    margin-bottom:20px;">
<img src="${crop.image}"
style="
width:220px;
height:170px;
object-fit:cover;
border-radius:15px;
margin-bottom:15px;
display:block;">
            <h3 style="color:#facc15;">🌾 ${crop.product}</h3>

            <p><strong>Farmer :</strong> ${crop.farmerName}</p>

            <p><strong>Price :</strong> ₹${crop.price} / Kg</p>

            <p><strong>Produce Type :</strong> ${crop.produceType}</p>

            <br>

            <button onclick="editCrop(${index})"
            style="width:120px;margin-right:10px;">
            ✏ Edit
            </button>

            <button onclick="deleteCrop(${index})"
            style="width:120px;background:red;">
            🗑 Delete
            </button>

        </div>
        `;

    });

    result.innerHTML = output;

}


// Delete Crop

function deleteCrop(index){

    let currentFarmer = JSON.parse(localStorage.getItem("currentFarmer"));

    let crops = JSON.parse(localStorage.getItem("crops")) || [];

   let myCrops = crops.filter(crop => 
    String(crop.farmerMobile).trim() ===
    String(currentFarmer.mobile).trim()
);

    let cropToDelete = myCrops[index];

    crops = crops.filter(crop => crop !== cropToDelete);

    localStorage.setItem("crops",JSON.stringify(crops));

    alert("Crop Deleted Successfully.");

    displayMyCrops();

}


// Edit Crop

function editCrop(index){

    let currentFarmer =
        JSON.parse(localStorage.getItem("currentFarmer"));

    let crops =
        JSON.parse(localStorage.getItem("crops")) || [];

    let myCrops = crops.filter(crop =>
        String(crop.farmerMobile).trim() ===
        String(currentFarmer.mobile).trim()
    );

    let crop = myCrops[index];

    if(!crop){
        alert("Crop not found.");
        return;
    }

    let newPrice =
        prompt(
            "Enter New Price",
            crop.price
        );

    if(newPrice === null){
        return;
    }

    if(newPrice.trim() === ""){
        alert("Please enter a valid price.");
        return;
    }

    crop.price = newPrice;

    localStorage.setItem(
        "crops",
        JSON.stringify(crops)
    );

    alert("Crop Updated Successfully.");

    displayMyCrops();
}

</script>
</body>
</html>
