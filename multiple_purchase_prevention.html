<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FarmXT | Multiple Purchase Prevention</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
overflow-x:hidden;
}

header{
position:fixed;
top:0;
left:0;
width:100%;
padding:15px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(20,0,31,.45);
backdrop-filter:blur(15px);
z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:28px;
font-weight:bold;
}

.logo img{
width:55px;
height:55px;
border-radius:50%;
background:white;
padding:5px;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:white;
transition:.3s;
}

nav a:hover{
color:#facc15;
}

.container{
padding:120px 20px 80px;
display:flex;
justify-content:center;
}

.card{
width:500px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
padding:30px;
}

.card h2{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:25px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px #d946ef;
}

#result{
margin-top:20px;
padding:18px;
background:rgba(255,255,255,.08);
border-radius:15px;
text-align:center;
font-size:17px;
}

footer{
text-align:center;
padding:18px;
background:rgba(20,0,31,.45);
}

</style>

</head>

<body>

<header>

<div class="logo">
<img src="logo.jpg">
<span>FarmXT</span>
</div>

<nav>

<a href="final.html">Home</a>
<a href="market_place.html">Marketplace</a>
<a href="multiple_purchase_prevention.html">Purchase Check</a>
<a href="contact.html">Contact</a>

</nav>

</header>

<div class="container">

<div class="card">

<h2>🛑 Prevent Multiple Purchases</h2>

<label>Customer Name</label>
<input type="text" id="customer">

<label>Product Name</label>
<input type="text" id="product">

<button onclick="purchaseProduct()">

Purchase

</button>

<div id="result">

Purchase status will appear here.

</div>

</div>

</div>

<footer>

©2026 FarmXT | Multiple Purchase Prevention

</footer>

<script>

let purchased=[];

function purchaseProduct(){

let customer=document.getElementById("customer").value.trim();
let product=document.getElementById("product").value.trim();

if(customer=="" || product==""){
alert("Please fill all fields");
return;
}

let key=customer.toLowerCase()+"-"+product.toLowerCase();

if(purchased.includes(key)){

document.getElementById("result").innerHTML=
`
<h3 style="color:red;">❌ Purchase Blocked</h3>

<p>You have already purchased <b>${product}</b>.</p>

<p>Multiple purchases are not allowed.</p>
`;

return;

}

purchased.push(key);

document.getElementById("result").innerHTML=
`
<h3 style="color:#7CFC00;">✅ Purchase Successful</h3>

<p>Customer : <b>${customer}</b></p>

<p>Product : <b>${product}</b></p>

<p>Your purchase has been recorded.</p>
`;

}

</script>

</body>
</html>
