<!DOCTYPE html>
<html lang="en">
<head>
<title>Logistics Route Optimization</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    width:100%;
    max-width:600px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 35px rgba(162,89,255,0.5);
}

.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}

h1{
    text-align:center;
    color:#ffffff;
    margin-bottom:30px;
    font-size:32px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#ead5ff;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    outline:none;
    font-size:15px;
}

input::placeholder{
    color:#d8c8f0;
}

input:focus{
    border:1px solid #d946ef;
    box-shadow:0 0 15px #c026d3;
}

button{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;
}

#result{
    margin-top:25px;
    padding:20px;
    background:rgba(255,255,255,0.12);
    border-left:5px solid #c084fc;
    border-radius:15px;
    line-height:1.8;
    color:#f3e8ff;
    font-size:16px;
    display:none;
}

#result strong{
    color:#facc15;
}

.route-title{
    color:#facc15;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

    <img src="logo.jpg" alt="FarmXT Logo" class="logo">


    <h1>🚚 FarmXT Logistics Route Optimization</h1>


    <label>Farm Location:</label>
    <input type="text" id="farm" placeholder="Enter farm location">


    <label>Destination:</label>
    <input type="text" id="destination" placeholder="Enter destination">


    <label>Distance (KM):</label>
    <input type="number" id="distance" placeholder="Enter distance">


    <label>Cost Per KM (₹):</label>
    <input type="number" id="costPerKm" placeholder="Enter cost per km">


    <button onclick="optimizeRoute()">
        🚚 Calculate Route Cost
    </button>


    <div id="result"></div>


</div>


<script>

function optimizeRoute(){

    let farm=document.getElementById("farm").value;
    let destination=document.getElementById("destination").value;
    let distance=Number(document.getElementById("distance").value);
    let costPerKm=Number(document.getElementById("costPerKm").value);


    if(farm==="" || destination==="" || distance<=0 || costPerKm<=0){

        alert("Please fill all fields correctly.");
        return;

    }


    let totalCost=distance*costPerKm;


    let output=`

        <div class="route-title">
            🚚 Optimized Route Details
        </div>

        <strong>Farm Location:</strong> ${farm}<br>

        <strong>Destination:</strong> ${destination}<br>

        <strong>Total Distance:</strong> ${distance} KM<br>

        <strong>Transportation Cost:</strong> ₹${totalCost}

    `;


    document.getElementById("result").style.display="block";

    document.getElementById("result").innerHTML=output;

}

</script>


</body>
</html>
