
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buyer Details | FarmXT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #14001f,
        #2d014d,
        #4b0082,
        #6a0dad
    );
    color:white;
    padding:40px 20px;
}

/* ===== CONTAINER ===== */

.container{
    width:100%;
    max-width:750px;
    margin:auto;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:35px;
    box-shadow:0 0 35px rgba(162,89,255,.5);
}

/* ===== LOGO ===== */

.logo{
    width:90px;
    height:90px;
    display:block;
    margin:0 auto 20px;
    border-radius:50%;
    background:white;
    padding:7px;
    box-shadow:0 0 20px #a855f7;
}

/* ===== HEADING ===== */

h1{
    text-align:center;
    margin-bottom:35px;
    font-size:34px;
}

h2{
    color:#facc15;
    margin-bottom:20px;
}

/* ===== DETAILS ===== */

.details{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:18px;
}

.detail-box{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    padding:18px;
    border-radius:15px;
}

.detail-box .label{
    color:#cdb5e9;
    font-size:14px;
    margin-bottom:7px;
}

.detail-box .value{
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ===== REQUIREMENT ===== */

.requirement{
    margin-top:30px;
    background:rgba(255,255,255,.08);
    padding:25px;
    border-radius:18px;
    border-left:5px solid #c084fc;
}

.requirement p{
    margin:12px 0;
    color:#ead5ff;
}

.requirement strong{
    color:#facc15;
}

/* ===== BUTTONS ===== */

.buttons{
    display:flex;
    gap:15px;
    margin-top:30px;
    flex-wrap:wrap;
}

.btn{
    flex:1;
    min-width:200px;
    padding:14px 20px;
    border:none;
    border-radius:30px;
    text-align:center;
    text-decoration:none;
    color:white;
    font-weight:bold;
    cursor:pointer;

    background:linear-gradient(
        90deg,
        #7e22ce,
        #9333ea,
        #c026d3
    );

    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;
}

.back-btn{
    background:rgba(255,255,255,.12);
}

/* ===== ERROR ===== */

.error{
    text-align:center;
    padding:40px;
}

.error h2{
    color:#f87171;
}

</style>

</head>

<body>

<div class="container">

    <img src="logo.jpg" class="logo" alt="FarmXT Logo">

    <h1>🏪 Buyer Details</h1>

    <div id="buyerContent"></div>

</div>


<script>

let buyer =
JSON.parse(localStorage.getItem("selectedBuyer"));

let container =
document.getElementById("buyerContent");


/* ===== CHECK WHETHER BUYER EXISTS ===== */

if(!buyer){

    container.innerHTML = `

        <div class="error">

            <h2>Buyer Not Found</h2>

            <p>
                The selected buyer information is not available.
            </p>

            <br>

            <a href="market_place.html" class="btn">
                ← Back to Marketplace
            </a>

        </div>

    `;

}else{

    container.innerHTML = `

        <h2>🏪 Business Information</h2>

        <div class="details">

            <div class="detail-box">

                <div class="label">
                    Business Name
                </div>

                <div class="value">
                    ${buyer.businessName || "Not Available"}
                </div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Owner Name
                </div>

                <div class="value">
                    ${buyer.ownerName || "Not Available"}
                </div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Buyer Type
                </div>

                <div class="value">
                    ${buyer.type || "Not Available"}
                </div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Location
                </div>

                <div class="value">
                    ${buyer.location || "Not Available"}
                </div>

            </div>

        </div>


        <div class="requirement">

            <h2>🌾 Buyer Requirement</h2>

            <p>
                <strong>Crop Needed:</strong>
                ${buyer.cropNeeded || "Not Available"}
            </p>

            <p>
                <strong>Quantity Required:</strong>
                ${buyer.quantity || "Not Available"}
            </p>

            <p>
                <strong>Price Offered:</strong>
                ₹${buyer.priceOffered || "Not Available"}
            </p>

            <p>
                <strong>Requirement Details:</strong>
                ${buyer.requirement || "No details provided"}
            </p>

        </div>


        <div class="buttons">

            <a
                href="market_place.html"
                class="btn back-btn">

                ← Back to Marketplace

            </a>

        </div>

    `;

}

</script>

</body>
</html>
