<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}

/* ===== NAVBAR ===== */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.15);
}

.logo-section{
display:flex;
align-items:center;
gap:15px;
}

.logo-title{
width:60px;
height:60px;
border-radius:50%;
background:white;
padding:5px;
box-shadow:0 0 15px #a855f7;
}

.logo-section h2{
font-size:30px;
}

nav{
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#facc15;
}

.logout{
padding:10px 18px;
border-radius:25px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
}

/* ===== CONTACT ===== */

.contact-section{
display:flex;
justify-content:center;
align-items:center;
padding:60px 20px;
}

.contact-card{
width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:40px;
box-shadow:0 0 30px rgba(162,89,255,.4);
}

.logo{
width:100px;
height:100px;
display:block;
margin:0 auto 20px;
border-radius:50%;
background:white;
padding:8px;
border:3px solid #c084fc;
box-shadow:0 0 25px #a855f7;
}

.contact-card h1{
text-align:center;
margin-bottom:10px;
}

.contact-card p{
text-align:center;
margin-bottom:30px;
color:#ead5ff;
}

.contact-card label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#ead5ff;
}

.contact-card input,
.contact-card textarea{
width:100%;
padding:14px;
margin-bottom:20px;
border-radius:12px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.12);
color:white;
outline:none;
font-size:15px;
}

.contact-card input::placeholder,
.contact-card textarea::placeholder{
color:#ead5ff;
}

.contact-card textarea{
height:150px;
resize:none;
}

.contact-card input:focus,
.contact-card textarea:focus{
border:1px solid #d946ef;
box-shadow:0 0 15px #c026d3;
}

.contact-card button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.contact-card button:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo-title">

<h2>FarmXT</h2>

</div>

<nav>

<a href="index.html">Home</a>

<a href="market_place.html">Marketplace</a>

<a href="community_network.html">Community</a>

<a href="direct_connection.html">Direct Connection</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>

<section class="contact-section">

<div class="contact-card">

<img src="logo.jpg" class="logo">

<h1>📞 Contact FarmXT</h1>

<p>Have any questions? We'd love to hear from you.</p>

<form id="contactForm">

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email address" required>

<label>Mobile Number</label>
<input type="tel" maxlength="10" placeholder="Enter mobile number" required>

<label>Subject</label>
<input type="text" placeholder="Enter subject" required>

<label>Message</label>
<textarea placeholder="Write your message here..." required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</section>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

alert("Thank you! Your message has been sent successfully.");

this.reset();

});

</script>

</body>

</html>
