<!DOCTYPE html>
<html lang="en">
<head>
<title>Farmer Transparency Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 35px rgba(168,85,247,0.5);
}


.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}


h1{
    text-align:center;
    color:white;
    margin-bottom:20px;
    font-size:32px;
}


.note{
    text-align:center;
    color:#e9d5ff;
    font-size:14px;
    margin-bottom:25px;
}


label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#f3e8ff;
}


input,
textarea{

    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:14px;
    outline:none;

}


input::placeholder,
textarea::placeholder{
    color:#d8b4fe;
}


textarea{
    resize:vertical;
    height:100px;
}


input:focus,
textarea:focus{

    border-color:#d946ef;
    box-shadow:0 0 12px #c026d3;

}


button{

    width:100%;
    padding:13px;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;

}

</style>

</head>


<body>


<div class="container">


<img src="logo.jpg" alt="FarmXT Logo" class="logo">


<h1>🌾 Farmer Transparency Form</h1>


<div class="note">
Enter accurate farm details to ensure transparency in pricing and quality.
</div>



<form>


<label>Farmer Name:</label>
<input type="text" placeholder="Enter farmer name">



<label>Farm Location:</label>
<input type="text" placeholder="Enter farm location">



<label>Crop Name:</label>
<input type="text" placeholder="Enter crop name">



<label>Quantity (Kg):</label>
<input type="number" placeholder="Enter quantity">



<label>Quality:</label>
<input type="text" placeholder="Enter quality">



<label>Price (₹ per Kg):</label>
<input type="number" placeholder="Enter price">



<label>Rating:</label>
<input type="number" step="0.1" placeholder="Enter rating">



<label>Customer Review:</label>
<textarea placeholder="Write review"></textarea>



<button type="submit">
    Submit Details
</button>


</form>
</div>
</body>
</html>
