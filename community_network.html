<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>community | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}
.community-section{

padding:60px 8%;

}

.community-section h1{

text-align:center;
font-size:42px;
margin-bottom:40px;

}

.post-card,
.feed-card{

max-width:900px;
margin:25px auto;
padding:30px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 25px rgba(162,89,255,.4);

}

.post-card h2,
.feed-card h2{

margin-bottom:20px;

}

textarea{

width:100%;
height:150px;
padding:15px;
border:none;
outline:none;
border-radius:15px;
resize:none;
background:rgba(255,255,255,.12);
color:white;
font-size:16px;
margin-bottom:20px;

}

textarea::placeholder{

color:#ead5ff;

}

button{

padding:14px 30px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;

}
</style>

</head>

<body>
    <section class="community-section">

<h1>🌱 Community Network</h1>

<div class="post-card">

<h2>Create a Post</h2>

<textarea placeholder="Share your farming experience, ask a question or give advice..."></textarea>

<button>Post</button>

</div>

<div class="feed-card">

<h2>Community Feed</h2>

<p>No posts yet. Start the conversation with other farmers!</p>

</div>

</section>
<script>

const button = document.querySelector("button");
const textarea = document.querySelector("textarea");
const feed = document.querySelector(".feed-card");

button.onclick = function(){

if(textarea.value.trim()==""){

alert("Please write something before posting.");
return;

}

feed.innerHTML += "<hr><p>" + textarea.value + "</p>";

textarea.value="";

}

</script>
</body>

</html>
