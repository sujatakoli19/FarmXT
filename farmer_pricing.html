<!DOCTYPE html>
<html lang="en">

<head>

<title>Farmer Controlled Pricing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    width:420px;
}

.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}

form{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    padding:35px;

    border-radius:25px;

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 0 35px rgba(162,89,255,0.5);

}


h2{

    text-align:center;

    color:white;

    margin-bottom:25px;

    font-size:30px;

}


label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

    color:#ead5ff;

}


input{

    width:100%;

    padding:13px;

    margin-bottom:18px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,0.25);

    background:rgba(255,255,255,0.12);

    color:white;

    outline:none;

    font-size:15px;

}


input::placeholder{

    color:#d8c8f0;

}


input:focus{

    border:1px solid #d946ef;

    box-shadow:0 0 15px #c026d3;

}


button{

    width:100%;

    padding:14px;

    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);

    color:white;

    border:none;

    border-radius:12px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:translateY(-3px);

    box-shadow:0 0 20px #d946ef;

}


</style>

</head>


<body>


<div class="container">


<img src="logo.jpg" alt="FarmXT Logo" class="logo">


<form onsubmit="addProduct(event)">


<h2>🌾 Set Your Product Price</h2>



<label>Product Name:</label>

<input 
type="text"
id="productName"
placeholder="Enter product name"
required>



<label>Product Quantity (kg):</label>

<input 
type="number"
id="quantity"
placeholder="Enter quantity"
required>



<label>Your Price (₹ per kg):</label>

<input 
type="number"
id="price"
placeholder="Set your own price"
required>



<label>Farm Location:</label>

<input 
type="text"
id="location"
placeholder="Enter farm location"
required>



<button type="submit">

➕ Add Product

</button>



</form>


</div>



<script>


function addProduct(event){

    event.preventDefault();


    let product={

        productName:
        document.getElementById("productName").value,


        quantity:
        document.getElementById("quantity").value,


        price:
        document.getElementById("price").value,


        location:
        document.getElementById("location").value

    };


    localStorage.setItem(
        "farmerProduct",
        JSON.stringify(product)
    );


    window.location.href="product_added.html";


}


</script>



</body>

</html>
