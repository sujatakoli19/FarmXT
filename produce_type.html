<!DOCTYPE html>
<html lang="en">
<head>
<title>FarmXT Produce Type</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}

.container{
    width:100%;
    max-width:600px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 35px rgba(162,89,255,0.5);
}

.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}

h1{
    text-align:center;
    color:#ffffff;
    margin-bottom:30px;
    font-size:32px;
}

h2{
    color:#f3e8ff;
    margin-top:25px;
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#ead5ff;
}

input,
select{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
    outline:none;
}

input::placeholder{
    color:#d8c8f0;
}

select option{
    background:#2d014d;
    color:white;
}

input:focus,
select:focus{
    border:1px solid #d946ef;
    box-shadow:0 0 15px #c026d3;
}

button{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;
}

#result{
    margin-top:20px;
    padding:20px;
    background:rgba(255,255,255,0.12);
    border-left:5px solid #c084fc;
    border-radius:15px;
    line-height:1.8;
    color:#f3e8ff;
    font-size:16px;
    display:none;
}

#result strong{
    color:#facc15;
}

.title{
    color:#facc15;
    font-weight:bold;
    margin-bottom:10px;
    font-size:20px;
}

</style>

</head>

<body>

<div class="container">

    <img src="logo.jpg" alt="FarmXT Logo" class="logo">


    <h1>🌾 FarmXT Product Listing</h1>


   
<label>Farmer Name:</label>
<input type="text" id="farmer" readonly>


    <label>Product Name:</label>
    <input type="text" id="product" placeholder="Enter product name">


    <label>Price (₹ per Kg):</label>
    <input type="number" id="price" placeholder="Enter price">


    <label>Select Produce Type:</label>

    <select id="produceType">

        <option>Organic</option>
        <option>Natural Farming</option>
        <option>Conventional</option>

    </select>
    <label>Crop Photo:</label>

<input
type="file"
id="cropImage"
accept="image/*">


    <button onclick="showProduct()">
        🌱 Submit Product
    </button>


    <h2>Product Details</h2>

    <div id="result"></div>


</div>


<script>
   window.onload = function(){

    let currentFarmer = JSON.parse(localStorage.getItem("currentFarmer"));

    if(!currentFarmer){
        alert("Please login first.");
        window.location.href = "farmer_login.html";
        return;
    }

    document.getElementById("farmer").value = currentFarmer.name;
}
function showProduct(){

let currentFarmer = JSON.parse(localStorage.getItem("currentFarmer"));

if(!currentFarmer){
    alert("Please login first.");
    window.location.href = "farmer_login.html";
    return;
    }

    let farmer = currentFarmer.name;
    let product = document.getElementById("product").value.trim();
    let price = document.getElementById("price").value.trim();
    let produceType = document.getElementById("produceType").value;
    let imageFile = document.getElementById("cropImage").files[0];

    if(farmer === "" || product === "" || price === ""){
        alert("Please fill all required fields.");
        return;
    }

    if(!imageFile){
        alert("Please upload a crop photo.");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(){

        let crops = JSON.parse(localStorage.getItem("crops")) || [];

  let crop = {
    farmerId: currentFarmer.id,
    farmerName: currentFarmer.name,
    farmerMobile: currentFarmer.mobile,
    product: product,
    price: price,
    produceType: produceType,
    image: reader.result
};

        crops.push(crop);

        localStorage.setItem("crops", JSON.stringify(crops));

        document.getElementById("result").style.display = "block";

        document.getElementById("result").innerHTML = `
            <div class="title">🌱 Product Added Successfully</div>

            <img src="${reader.result}"
            style="width:180px;height:140px;
            object-fit:cover;
            border-radius:15px;
            margin-bottom:15px;">

            <br>

            <strong>Farmer Name:</strong> ${farmer}<br>
            <strong>Product:</strong> ${product}<br>
            <strong>Price:</strong> ₹${price} per Kg<br>
            <strong>Produce Type:</strong> ${produceType}
        `;

        setTimeout(function(){
            window.location.href = "featured_listings.html";
        },2000);

    };

    reader.readAsDataURL(imageFile);
}
</script>
</body>
</html>
