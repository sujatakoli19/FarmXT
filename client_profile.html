<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Client Profile | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.15);
}

.logo-section{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:60px;
height:60px;
border-radius:50%;
background:white;
padding:5px;
}

.logo-section h2{
font-size:30px;
}

nav{
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#facc15;
}

.logout{
padding:10px 18px;
border-radius:25px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
}

.profile-section{
display:flex;
justify-content:center;
padding:60px 20px;
}

.profile-card{
width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:40px;
box-shadow:0 0 30px rgba(162,89,255,.4);
}

.profile-image{
width:150px;
height:150px;
display:block;
margin:0 auto 20px;
border-radius:50%;
object-fit:cover;
border:4px solid #c084fc;
box-shadow:0 0 25px #a855f7;
}

.profile-card h1{
text-align:center;
margin-bottom:30px;
}

.input-box{
margin-bottom:20px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#ead5ff;
}

.input-box input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.12);
color:white;
outline:none;
font-size:15px;
}

.input-box input::placeholder{
color:#ead5ff;
}

.input-box input:focus{
border:1px solid #d946ef;
box-shadow:0 0 15px #c026d3;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
margin-top:30px;
}

.edit-btn,
.save-btn{
padding:14px 30px;
border:none;
border-radius:30px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
transition:.3s;
}

.edit-btn:hover,
.save-btn:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #d946ef;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo">

<h2>FarmXT</h2>

</div>

<nav>

<a href="client_dashboard.html">Dashboard</a>

<a href="market_place.html">Marketplace</a>

<a href="my_orders.html">My Orders</a>

<a href="contact.html">Support</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>

<section class="profile-section">

<div class="profile-card">

<img src="profile.png" id="previewImage" class="profile-image">

<h1>Client Profile</h1>

<form>

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" maxlength="10" placeholder="Enter mobile number" oninput="this.value=this.value.replace(/[^0-9]/g,'')" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter email address">
</div>

<div class="input-box">
<label>House / Flat No.</label>
<input type="text" placeholder="Enter house number">
</div>

<div class="input-box">
<label>Street / Area</label>
<input type="text" placeholder="Enter street">
</div>
<div class="input-box">
<label>City</label>
<input type="text" placeholder="Enter city">
</div>

<div class="input-box">
<label>State</label>
<input type="text" placeholder="Enter state">
</div>

<div class="input-box">
<label>PIN Code</label>
<input type="text"
       maxlength="6"
       placeholder="Enter PIN Code"
       oninput="this.value=this.value.replace(/[^0-9]/g,'')">
</div>

<div class="input-box">
<label>Upload Profile Photo</label>
<input type="file" id="profilePhoto" accept="image/*">
</div>

<div class="buttons">

<button type="button" class="edit-btn">
Edit Profile
</button>

<button type="submit" class="save-btn">
Save Profile
</button>

</div>

</form>

</div>

</section>

<script>

const profilePhoto = document.getElementById("profilePhoto");
const previewImage = document.getElementById("previewImage");

profilePhoto.addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

previewImage.src=e.target.result;

}

reader.readAsDataURL(file);

}

});

document.querySelector("form").addEventListener("submit",function(e){

e.preventDefault();

alert("Profile saved successfully!");

});

</script>

</body>

</html>
