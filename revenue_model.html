<!DOCTYPE html>
<html lang="en">
<head>
<title>FarmXT Revenue Model</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
}


.container{
    width:100%;
    max-width:500px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    padding:35px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 35px rgba(162,89,255,0.5);
}


.logo{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 20px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:8px;
    border:3px solid #c084fc;
    box-shadow:0 0 25px #a855f7;
}


h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:32px;
}


h2{
    text-align:center;
    color:#f3e8ff;
    margin-top:25px;
    margin-bottom:15px;
}


label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#ead5ff;
}


select,
input{

    width:100%;
    padding:13px;
    margin-bottom:18px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
    outline:none;

}


select option{
    background:#2d014d;
    color:white;
}


input::placeholder{
    color:#d8c8f0;
}


select:focus,
input:focus{

    border:1px solid #d946ef;
    box-shadow:0 0 15px #c026d3;

}


button{

    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    transform:translateY(-3px);
    box-shadow:0 0 20px #d946ef;

}


hr{

    margin:30px 0;
    border:none;
    border-top:2px solid rgba(255,255,255,0.2);

}


#result{

    background:rgba(255,255,255,0.12);
    padding:20px;
    border-left:5px solid #c084fc;
    border-radius:15px;
    color:#f3e8ff;
    font-size:16px;
    min-height:50px;
    line-height:1.8;

}


.highlight{

    color:#facc15;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="container">


<img src="logo.jpg" alt="FarmXT Logo" class="logo">


<h1>💰 FarmXT Profit Margin Sources</h1>


<label>Select Revenue Source:</label>


<select id="revenueType">

    <option>Advertisements</option>

    <option>Subscriptions</option>

    <option>Transport Charges</option>

    <option>Logistics Services</option>

</select>


<label>Profit Earned (₹):</label>


<input type="number" id="amount" placeholder="Enter amount">



<button onclick="showRevenue()">
    📊 Display Profit
</button>



<hr>



<h2>Revenue Details</h2>


<div id="result">
    No revenue data submitted yet.
</div>



</div>



<script>

function showRevenue(){

    let revenueType =
    document.getElementById("revenueType").value;

    let amount =
    Number(document.getElementById("amount").value);

    if(amount<=0){

        alert("Please enter a valid amount.");

        return;

    }

    let description="";

    if(revenueType=="Advertisements"){

        description=
        "Income earned from advertisements displayed on the FarmXT platform.";

    }

    else if(revenueType=="Subscriptions"){

        description=
        "Income earned from premium subscriptions purchased by users.";

    }

    else if(revenueType=="Transport Charges"){

        description=
        "Income earned from transporting products from farmers to customers.";

    }

    else if(revenueType=="Logistics Services"){

        description=
        "Income earned through logistics and delivery management.";

    }

    document.getElementById("result").innerHTML=

    `<span class="highlight">Profit Source:</span> ${revenueType}<br>

    <span class="highlight">Profit Earned:</span> ₹${amount}<br><br>

    ${description}`;

}
</script>



</body>
</html>
