<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}
/* ===== NAVBAR ===== */

.navbar{

display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.15);
position:sticky;
top:0;
z-index:1000;

}

.logo-section{

display:flex;
align-items:center;
gap:15px;

}

.logo{

width:60px;
height:60px;
border-radius:50%;
background:white;
padding:5px;
box-shadow:0 0 15px #a855f7;

}

.logo-section h2{

color:white;
font-size:30px;

}

nav{

display:flex;
align-items:center;
gap:25px;

}

nav a{

color:white;
text-decoration:none;
font-size:16px;
font-weight:600;
transition:.3s;

}

nav a:hover{

color:#facc15;

}

.logout{

background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
padding:10px 18px;
border-radius:25px;

}

.logout:hover{

box-shadow:0 0 20px #d946ef;

}
/* ===== TRACK ORDER ===== */

.tracking-section{

padding:60px 8%;
display:flex;
flex-direction:column;
align-items:center;

}

.tracking-section h1{

font-size:42px;
margin-bottom:30px;
color:white;

}

.tracking-card{

width:100%;
max-width:1000px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:40px;
box-shadow:0 0 30px rgba(162,89,255,.4);

}

.tracking-card h2{

text-align:center;
margin-bottom:40px;
font-size:32px;
color:white;

}

.timeline{

display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

}

.step{

display:flex;
flex-direction:column;
align-items:center;
text-align:center;

}

.circle{

width:70px;
height:70px;
border-radius:50%;
background:rgba(255,255,255,.15);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
color:white;
border:3px solid #c084fc;

}

.step.active .circle{

background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
box-shadow:0 0 20px #d946ef;

}

.step p{

margin-top:15px;
color:#ead5ff;
font-weight:600;

}

.line{

flex:1;
height:4px;
background:#c084fc;
margin:0 15px;
min-width:50px;

}
</style>

</head>

<body>
    <header class="navbar">

<div class="logo-section">

<img src="logo.jpg" class="logo">

<h2>FarmXT</h2>

</div>

<nav>

<a href="client_dashboard.html">Dashboard</a>

<a href="market_place.html">Marketplace</a>

<a href="my_orders.html">My Orders</a>

<a href="client_profile.html">Profile</a>

<a href="index.html" class="logout">Logout</a>

</nav>

</header>
<section class="tracking-section">

<h1>Track Your Order</h1>

<div class="tracking-card">

<h2>Order Status</h2>

<div class="timeline">

<div class="step active">
<div class="circle">✓</div>
<p>Order Placed</p>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">2</div>
<p>Accepted</p>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">3</div>
<p>Shipped</p>
</div>

<div class="line"></div>

<div class="step">
<div class="circle">4</div>
<p>Delivered</p>
</div>

</div>

</div>

</section>

<script>

const steps = document.querySelectorAll(".step");

let current = 0;

setInterval(() => {

if(current < steps.length-1){

current++;

steps[current].classList.add("active");

}

},3000);

</script>
</body>

</html>
