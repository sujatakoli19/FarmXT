<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Crops | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
min-height:100vh;
color:white;
}

/* Navbar */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.15);
}

.logo-section{
display:flex;
align-items:center;
gap:15px;
}

.logo{
width:60px;
height:60px;
background:white;
padding:5px;
border-radius:50%;
}

.logo-section h2{
font-size:30px;
}

.back-btn{
text-decoration:none;
padding:12px 25px;
border-radius:30px;
background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
color:white;
font-weight:bold;
}

.back-btn:hover{
box-shadow:0 0 20px #d946ef;
}

/* Heading */

.heading{
text-align:center;
padding:40px 20px;
}

.heading h1{
font-size:42px;
margin-bottom:10px;
}

.heading p{
color:#ead5ff;
}

/* Table */

.table-container{
width:90%;
margin:auto;
overflow-x:auto;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
padding:25px;
border-radius:20px;
box-shadow:0 0 25px rgba(162,89,255,.3);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#7e22ce;
padding:15px;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,.15);
}

tr:hover{
background:rgba(255,255,255,.08);
}

/* Buttons */

button{
padding:8px 18px;
margin:3px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
color:white;
}

.edit{
background:#16a34a;
}

.delete{
background:#dc2626;
}

button:hover{
opacity:.9;
}

.footer{
text-align:center;
padding:25px;
margin-top:40px;
color:#ead5ff;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo-section">
<img src="logo.jpg" class="logo">
<h2>FarmXT Admin</h2>
</div>

<a href="admin_dashboard.html" class="back-btn">⬅ Dashboard</a>

</header>

<section class="heading">

<h1>🌾 Manage Crops</h1>

<p>View, edit and delete crop listings uploaded by farmers.</p>
<button onclick="window.location.href='manage_crops.html'"></button>


</section>

<div class="table-container">

<table id="cropTable">

<tr>
<th>Crop ID</th>
<th>Crop Name</th>
<th>Farmer</th>
<th>Price (₹/Kg)</th>
<th>Quantity (Kg)</th>
<th>Actions</th>
</tr>

<tr>
<td>CR001</td>
<td>Tomato</td>
<td>Ramesh Patil</td>
<td>40</td>
<td>200</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

<tr>
<td>CR002</td>
<td>Potato</td>
<td>Suresh Kumar</td>
<td>30</td>
<td>500</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

<tr>
<td>CR003</td>
<td>Onion</td>
<td>Mahesh Singh</td>
<td>35</td>
<td>350</td>
<td>
<button class="edit" onclick="editCrop(this)">Edit</button>
<button class="delete" onclick="deleteCrop(this)">Delete</button>
</td>
</tr>

</table>

</div>

<div class="footer">

© 2026 FarmXT Admin Panel

</div>

<script>

function deleteCrop(btn){

if(confirm("Are you sure you want to delete this crop listing?")){

btn.parentElement.parentElement.remove();

}

}

function editCrop(btn){

let row=btn.parentElement.parentElement;

let crop=prompt("Edit Crop Name",row.cells[1].innerHTML);

if(crop!=null && crop!=""){
row.cells[1].innerHTML=crop;
}

let farmer=prompt("Edit Farmer Name",row.cells[2].innerHTML);

if(farmer!=null && farmer!=""){
row.cells[2].innerHTML=farmer;
}

let price=prompt("Edit Price (₹/Kg)",row.cells[3].innerHTML);

if(price!=null && price!=""){
row.cells[3].innerHTML=price;
}

let quantity=prompt("Edit Quantity (Kg)",row.cells[4].innerHTML);

if(quantity!=null && quantity!=""){
row.cells[4].innerHTML=quantity;
}

alert("Crop details updated successfully.");

}

</script>

</body>
</html>
