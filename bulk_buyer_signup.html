<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Buyer Sign Up | FarmXT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;

    background:linear-gradient(
        135deg,
        #14001f,
        #2d014d,
        #4b0082,
        #6a0dad
    );

    color:white;

}


/* ===== SIGNUP BOX ===== */

.signup-box{

    width:100%;
    max-width:480px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:25px;

    padding:35px;

    box-shadow:
        0 0 35px rgba(162,89,255,.5);

}


/* ===== LOGO ===== */

.logo{

    display:block;

    margin:auto;

    width:100px;
    height:100px;

    padding:7px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 20px #a855f7;

}


/* ===== HEADING ===== */

h2{

    text-align:center;

    color:white;

    margin:20px 0 10px;

}

.subtitle{

    text-align:center;

    color:#ead5ff;

    margin-bottom:30px;

    line-height:1.6;

}


/* ===== FORM ===== */

.form-group{

    margin-bottom:18px;

}

label{

    display:block;

    color:#ead5ff;

    font-weight:600;

    margin-bottom:8px;

}


input,
select,
textarea{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.2);

    background:rgba(255,255,255,.08);

    color:white;

    outline:none;

    font-size:15px;

}


input::placeholder,
textarea::placeholder{

    color:#d8c8f0;

}


input:focus,
select:focus,
textarea:focus{

    border:1px solid #d946ef;

    box-shadow:
        0 0 15px #c026d3;

}


select option{

    color:black;

}


textarea{

    min-height:100px;

    resize:vertical;

}


/* ===== BUTTON ===== */

.signup-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(
        90deg,
        #7e22ce,
        #9333ea,
        #c026d3
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

    transition:.3s;

}


.signup-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 20px #d946ef;

}


/* ===== LINKS ===== */

.links{

    text-align:center;

    margin-top:22px;

    line-height:32px;

}


.links a{

    color:white;

    text-decoration:none;

    font-weight:600;

}


.links a:hover{

    color:#facc15;

}


/* ===== MOBILE ===== */

@media(max-width:500px){

    .signup-box{

        padding:28px 20px;

    }

}

</style>

</head>


<body>


<div class="signup-box">


    <!-- LOGO -->

    <img
        src="logo.jpg"
        class="logo"
        alt="FarmXT Logo">


    <!-- HEADING -->

    <h2>
        🏪 Bulk Buyer Sign Up
    </h2>


    <p class="subtitle">

        Create your Bulk Buyer account
        and connect with farmers.

    </p>



    <!-- FORM -->

    <form
        id="signupForm">


        <!-- BUSINESS NAME -->

        <div class="form-group">

            <label>
                Business Name
            </label>

            <input
                type="text"
                id="businessName"
                placeholder="Enter business name"
                required>

        </div>



        <!-- OWNER NAME -->

        <div class="form-group">

            <label>
                Owner Name
            </label>

            <input
                type="text"
                id="ownerName"
                placeholder="Enter owner name"
                required>

        </div>



       



        <!-- MOBILE NUMBER -->

        <div class="form-group">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                maxlength="10"
                placeholder="Enter 10-digit mobile number"
                required>

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter email address"
                required>

        </div>



        <!-- BUSINESS LOCATION -->

        <div class="form-group">

            <label>
                Business Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Enter business location"
                required>

        </div>



        <!-- DESCRIPTION -->

        <div class="form-group">

            <label>
                Business Description
            </label>

            <textarea
                id="description"
                placeholder="Tell us about your business">
            </textarea>

        </div>



        <!-- SIGN UP BUTTON -->

        <button
            type="submit"
            class="signup-btn">

            Create Bulk Buyer Account

        </button>


    </form>



    <!-- LINKS -->

    <div class="links">

        <p>

            Already have an account?

            <a href="bulk_buyer_login.html">

                Login

            </a>

        </p>


        <p>

            <a href="final.html">

                🏠 Back to Home

            </a>

        </p>

    </div>


</div>



<script>


// =====================================================
// SIGNUP
// =====================================================

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();



        // =================================================
        // GET VALUES
        // =================================================

        let businessName =
            document
            .getElementById("businessName")
            .value
            .trim();


        let ownerName =
            document
            .getElementById("ownerName")
            .value
            .trim();




        let mobile =
            document
            .getElementById("mobile")
            .value
            .trim();


        let email =
            document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        let location =
            document
            .getElementById("location")
            .value
            .trim();


        let description =
            document
            .getElementById("description")
            .value
            .trim();



        // =================================================
        // VALIDATE MOBILE
        // =================================================

        if(
            mobile.length !== 10 ||
            isNaN(mobile)
        ){

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }



        // =================================================
        // GET EXISTING BUYERS
        // =================================================

        let bulkBuyers =
            JSON.parse(
                localStorage.getItem("bulkBuyers")
            ) || [];



        // =================================================
        // CHECK DUPLICATE MOBILE
        // =================================================

        let existingBuyer =
            bulkBuyers.find(
                function(buyer){

                    return buyer.mobile === mobile;

                }
            );


        if(existingBuyer){

            alert(
                "This mobile number is already registered. Please login."
            );

            window.location.href =
                "bulk_buyer_login.html";

            return;

        }



        // =================================================
        // CREATE BUYER
        // =================================================

        let newBuyer = {

            id:
                Date.now(),

            businessName:
                businessName,

            ownerName:
                ownerName,
                
            mobile:
                mobile,

            email:
                email,

            location:
                location,

            description:
                description,

            createdAt:
                new Date().toLocaleString()

        };



        // =================================================
        // SAVE BUYER
        // =================================================

        bulkBuyers.push(newBuyer);


        localStorage.setItem(
            "bulkBuyers",
            JSON.stringify(bulkBuyers)
        );



        // =================================================
        // SUCCESS
        // =================================================

        alert(
            "Bulk Buyer account created successfully!"
        );


        window.location.href =
            "bulk_buyer_login.html";

    }
);

</script>


</body>

</html>
