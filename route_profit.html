<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmXT | Route Cost Profit Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#14001f,#2d014d,#4b0082,#6a0dad);
    height:100vh;
    overflow:hidden;
    color:white;
    font-family:'Poppins',sans-serif;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    padding:12px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(20,0,31,.45);
    backdrop-filter:blur(15px);
    z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:28px;
font-weight:bold;
}

.logo img{
width:55px;
height:55px;
border-radius:50%;
background:white;
padding:5px;
}

nav{
display:flex;
gap:25px;
}

nav a{
text-decoration:none;
color:white;
}

nav a:hover{
color:#facc15;
}

.container{
    min-height:calc(100vh - 140px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding-top:100px;   /* was 80px */
    padding-bottom:60px; /* keeps distance from footer */
}

.card{
    width:430px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.2);
}

.card h2{
    text-align:center;
    margin-bottom:18px;
    font-size:18px;
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:4px;
    font-size:15px;
}

input{
    width:100%;
    padding:9px;
    border:none;
    border-radius:10px;
    font-size:15px;
}

button{
    margin-top:16px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(90deg,#7e22ce,#9333ea,#c026d3);
    color:white;
}

.result{
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    text-align:center;
    font-size:15px;
    line-height:1.5;
}

.result h2{
    font-size:20px;
}

.result h3{
    font-size:18px;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    padding:12px;
    text-align:center;
    background:rgba(20,0,31,.45);
    backdrop-filter:blur(10px);
}

</style>

</head>

<body>

<header>

<div class="logo">
<img src="logo.jpg">
<span>FarmXT</span>
</div>

<nav>
<a href="final.html">Home</a>
<a href="market_place.html">Marketplace</a>
<a href="profit_calculation_system.html">Profit</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<div class="container">

<div class="card">

<h2>🚚 Route Cost Profit Calculator</h2>

<label>Production Cost (₹)</label>
<input type="number" id="production">

<label>Route Cost (₹)</label>
<input type="number" id="route">

<label>Selling Price per Kg (₹)</label>
<input type="number" id="price">

<label>Quantity (Kg)</label>
<input type="number" id="qty">

<button onclick="calculateProfit()">
Calculate Profit
</button>

<div class="result" id="result">

Profit will appear here

</div>

</div>

</div>

<footer>

©2026 FarmXT | Empowering Farmers

</footer>

<script>

function calculateProfit(){

let production=Number(document.getElementById("production").value);

let route=Number(document.getElementById("route").value);

let price=Number(document.getElementById("price").value);

let qty=Number(document.getElementById("qty").value);

if (
document.getElementById("production").value === "" ||
document.getElementById("route").value === "" ||
document.getElementById("price").value === "" ||
document.getElementById("qty").value === ""
)
{
alert("Please fill all fields");
return;
}

let income=price*qty;

let profit=income-(production+route);

let color = profit >= 0 ? "#22c55e" : "#ef4444";

document.getElementById("result").innerHTML = `
<h3 style="margin-bottom:10px;">📊 Calculation Result</h3>

<p>💰 Income : <b>₹${income}</b></p>

<p>🏭 Production Cost : <b>₹${production}</b></p>

<p>🚚 Route Cost : <b>₹${route}</b></p>

<hr style="margin:12px 0;border:1px solid rgba(255,255,255,.2);">

<h2 style="color:${color};">
${profit >= 0 ? "✅ Net Profit" : "❌ Net Loss"} : ₹${Math.abs(profit)}
</h2>
`;

}

</script>

</body>
</html>
